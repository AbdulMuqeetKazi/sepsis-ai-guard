services:
  - type: web
    name: sepsisai-guard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_NAME
        value: "SepsisAI Guard"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: PREDICTION_THRESHOLD
        value: "0.50"
      - key: ALERT_PROBABILITY_THRESHOLD
        value: "0.70"
